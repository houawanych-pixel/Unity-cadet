<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Unity Cadet — Anime Mobile Prototype v0.2.0</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#040b15;color:#dff6ff;font:16px system-ui;overflow:hidden;touch-action:none}body{display:grid;place-items:center}#canvas{width:min(100vw,177.777vh);height:min(100vh,56.25vw);outline:none;touch-action:none}#load,#rotate{position:fixed;inset:0;background:#071426;display:grid;place-content:center;text-align:center;padding:30px}h1{letter-spacing:.2em}p{color:#9bbfd0}#rotate{display:none;z-index:10}#error{color:#ffaf97}button{border:1px solid #67dcff;background:#174967;color:white;border-radius:10px;padding:14px;font-size:18px}@media(orientation:portrait){#rotate{display:grid}}
</style></head><body><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Unity Cadet flight training"></canvas><div id="load"><h1>UNITY CADET</h1><p>Anime mobile prototype • v0.2.0</p><p id="progress">Preparing cockpit…</p><p id="error"></p></div><div id="rotate"><h1>TURN YOUR PHONE</h1><p>Use landscape for both sticks and the flight controls.</p></div><script src="game.js"></script><script>
const config={args:[],canvas:document.getElementById('canvas'),canvasResizePolicy:0,executable:'game',fileSizes:{},focusCanvas:true,gdextensionLibs:[],onProgress:(loaded,total)=>{document.getElementById('progress').textContent=total?`Loading cockpit ${Math.round(100*loaded/total)}%`:'Loading cockpit…'}};
const engine=new Engine(config);engine.startGame().then(()=>{document.getElementById('load').style.display='none'}).catch(e=>{document.getElementById('error').textContent='Could not load the game. Please reload in Chrome. '+e.message});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>

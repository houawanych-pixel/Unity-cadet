name: Mobile cockpit playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -j /tmp/templates.tpz templates/web_nothreads_release.zip -d ~/.local/share/godot/export_templates/4.3.stable
      - name: Import, test, export
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path client --editor --import --quit
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path client -- --self-test
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path client --export-release Web
          printf 'Unity Cadet v0.2.0\nCommit: %s\nGodot 4.3\n' "$GITHUB_SHA" > web/version.txt
          cd web
          sha256sum game.wasm game.pck >> version.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
